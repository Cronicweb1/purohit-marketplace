name: purohit
description: Purohit Marketplace — connect families with verified Hindu priests.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # flutter_dotenv reads .env through rootBundle, so it MUST be declared as an
  # asset or dotenv.load() throws and Supabase is never initialised — silently,
  # because main.dart swallows that error to keep CI green.
  assets:
    - .env
