name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ and ios/ are gitignored; regenerate them each run so the repo
      # stays small and platform files never drift.
      #
      # `flutter create .` also drops its OWN template test/widget_test.dart,
      # which references the template class `MyApp`. Our app class is
      # `PurohitApp`, so that generated file fails `flutter analyze` with
      # "The name 'MyApp' isn't a class". Delete it — test/smoke_test.dart is
      # the real test and it is committed.
      - name: Generate platform folders
        run: |
          flutter create . --project-name purohit --platforms=android,ios
          rm -f test/widget_test.dart

      # `flutter create` writes android.permission.INTERNET into ONLY the
      # debug and profile manifests (needed for the Dart VM service / hot
      # reload). The main manifest -- the one that actually ships inside a
      # RELEASE apk -- has no INTERNET permission at all, so every network
      # call dies with "Failed host lookup: ... errno = 7", which looks
      # exactly like a DNS or Supabase outage but is a permission denial.
      # Re-inject it after every regeneration.
      - name: Grant INTERNET permission to the release manifest
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' in s:
              print('INTERNET already present')
          else:
              s = re.sub(r'(<manifest\b[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                         s, count=1)
              p.write_text(s)
              print('INTERNET permission added')
          PY
          cat android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml \
            || { echo "::error::INTERNET permission missing from release manifest"; exit 1; }

      # .env is gitignored but declared as an asset in pubspec.yaml, so the
      # build fails outright if the file is absent. Populate it from repo
      # secrets when present so the artifact APK really talks to Supabase;
      # otherwise fall back to the placeholder template.
      - name: Write .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
            echo "Wrote .env from repository secrets."
          else
            cp .env.example .env
            echo "::warning::Secrets missing - built with placeholder .env, app will not reach Supabase."
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # One universal release APK instead of a per-ABI split.
      #
      # --split-per-abi produced three files (arm64-v8a, armeabi-v7a, x86_64)
      # and the download arrived as a zip you had to choose from. A universal
      # APK bundles all three ABIs into a single file that installs on any
      # phone or emulator: ~40-50% larger to download, but nothing to pick.
      # Reverting is a one-line change -- re-add --split-per-abi and restore
      # the app-*-release.apk artifact path -- and it touches only this
      # workflow, never the app code or the Supabase project.
      #
      # The debug build was dropped: the release build already proves the app
      # compiles, and analyze + test already gate correctness, so building both
      # roughly doubled the job for no extra signal. Debug-signed either way,
      # so this is still test-only, not Play Store ready.
      - run: flutter build apk --release

      - name: Report APK sizes
        run: |
          {
            echo "### APK sizes"
            echo ""
            echo "| Variant | Bytes | MB |"
            echo "|---|---:|---:|"
            for f in build/app/outputs/flutter-apk/*.apk; do
              b=$(stat -c%s "$f")
              printf '| `%s` | %s | %s |\n' \
                "$(basename "$f")" "$b" "$(awk -v b="$b" 'BEGIN{printf "%.1f", b/1048576}')"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
