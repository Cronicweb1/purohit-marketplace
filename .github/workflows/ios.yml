name: iOS

# iOS builds REQUIRE macOS — Apple licensing plus Xcode. They cannot run on the
# Azure VM or any Linux runner. Free on public repos; on private repos macOS
# minutes bill at a 10x multiplier (~200 real minutes on the free tier).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Drop the template test/widget_test.dart that `flutter create` regenerates
      # (it references the template class `MyApp`, not our `PurohitApp`).
      - name: Generate platform folders
        run: |
          flutter create . --project-name purohit --platforms=android,ios
          rm -f test/widget_test.dart

      # ios/ is gitignored (regenerated above), so the camera/photo usage
      # strings have to be injected every run. iOS kills the app on launch of
      # the picker if these keys are missing - it is not a warning.
      - name: Inject photo permission strings
        run: |
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Purohit Marketplace needs your photo library so you can attach your ID card and certificates.'" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Purohit Marketplace needs the camera so you can photograph your ID card and certificates.'" $P || true
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" $P

      # .env is a declared asset in pubspec.yaml — the build fails if absent.
      - name: Write .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
            echo "Wrote .env from repository secrets."
          else
            cp .env.example .env
            echo "::warning::Secrets missing - built with placeholder .env, app will not reach Supabase."
          fi

      - run: flutter pub get

      # Previously this job ran NEITHER analyze NOR test, so it stayed green
      # through a broken build and gave a false sense of health. Both now run
      # here too — a green iOS badge should mean something.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # --no-codesign compiles without Apple certificates, so CI is green before
      # you enrol in the Apple Developer Program. Swap to a signed archive +
      # TestFlight upload once the certs are in GitHub Secrets.
      - run: flutter build ios --debug --no-codesign
